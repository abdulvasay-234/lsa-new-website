  <path d="M54 190H360M1240 190H1546M54 810H360M1240 810H1546" fill="none" stroke="#ad5c71" stroke-width="3"/>
  <path d="M132 120L172 80L212 120L172 160Z M1388 120L1428 80L1468 120L1428 160Z M132 880L172 840L212 880L172 920Z M1388 880L1428 840L1468 880L1428 920Z" fill="#800020"/>
